<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to access MEDITSIIN4.0">
    <title>Login - MEDITSIIN4.0</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(var(--gradient-angle), var(--gradient-start) 0%, var(--gradient-end) 100%);
            padding: 2rem;
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 100%;
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            font-size: 2rem;
            font-weight: 700;
        }
        .login-box .subtitle {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-light);
            font-size: 0.95rem;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .login-form input {
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: var(--font-family);
            transition: border-color 0.3s;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .login-form button {
            padding: 0.75rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-family: var(--font-family);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .login-form button:hover {
            background: var(--primary-dark);
        }
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: -1rem;
            display: none;
            text-align: center;
        }
        .error-message.show {
            display: block;
        }
        @media (max-width: 768px) {
            .login-box {
                padding: 2rem 1.5rem;
            }
            .login-box h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>MEDITSIIN4.0</h1>
            <p class="subtitle">Please login to continue</p>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <div class="error-message" id="errorMessage">Incorrect username or password. Please try again.</div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
    <script>
        // Credentials
        const CORRECT_USERNAME = 'demo';
        const CORRECT_PASSWORD = 'demo';
        
        // Check if already authenticated
        if (sessionStorage.getItem('authenticated') === 'true') {
            window.location.href = 'index.html';
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                // Store authentication in sessionStorage
                sessionStorage.setItem('authenticated', 'true');
                // Redirect to main page
                window.location.href = 'index.html';
            } else {
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
